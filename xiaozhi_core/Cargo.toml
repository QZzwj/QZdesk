[package]
name = "xiaozhi_linux_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xiaozhi-linux-rs"
path = "src/main.rs"

[dependencies]
alsa = "0.9"
opus = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tracing = "0.1"
anyhow = "1.0"
bytes = "1.0"
futures-util = "0.3"
url = "2.5.7"
log = "0.4"
env_logger = "0.11.8"
mac_address = "1.1.8"
uuid = { version = "1.18.1", features = ["v4"] }
async-trait = "0.1.89"
sha2 = "0.10"
base64 = "0.22"
# 只为一件事：提醒要按"设备本地钟点"判断，而 std 没有本地时间。
# libc 本来就在依赖树里（alsa / tokio），不新增编译产物。
libc = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"
pkg-config = "0.3"
cc = "1.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
flate2 = "1.0"
tar = "0.4"
autotools = "0.2"

# 优化release
[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = true        
