[application]
name = "QZdesk"
version = "1.0.0"

[board]
type = "QZdesk"
name = "嵌智"

# 音频设备配置
[audio]
capture_device = "default"
playback_device = "default"
# 音频设备兼容性配置
stream_format = "opus"          # 网络下发流的编码格式 "opus", "mp3", "pcm"
playback_sample_rate = 48000
playback_channels = 2
playback_period_size = 960     # 硬件缓冲区配置

# GUI进程配置
[gui]
local_port = 5678
remote_port = 5679
local_ip = "0.0.0.0"
remote_ip = "127.0.0.1"
buffer_size = 4096

# 网络配置
[network]
ws_url = "wss://api.tenclass.net/xiaozhi/v1/"
ota_url = "https://api.tenclass.net/xiaozhi/ota/"
ws_token = "test-token"
device_id = "unknown-device"
client_id = "unknown-client"

# 功能开关
[features]
enable_tts_display = true

# 主动问候语音合成（讯飞在线语音合成 WebAPI）
# GUI 与 web 的文字聊天始终以 listen/detect/text 直发云端；超时或云端拒绝时
# 只报告错误，不会回退为合成语音。主动问候与存在检测会使用这里。
#
# 下面这些是**默认值**，运行时可以用同名的 QZDESK_TTS_* 环境变量覆盖，这样
# 账号密钥不必固化进二进制：
#   QZDESK_TTS_APP_ID / QZDESK_TTS_API_KEY / QZDESK_TTS_API_SECRET
#   QZDESK_TTS_VOICE / QZDESK_TTS_SPEED / QZDESK_TTS_VOLUME / QZDESK_TTS_PITCH
#   QZDESK_TTS_ENABLE=0 可整体关掉
[tts]
enabled = true
app_id = "b34bb460"
api_key = "410834c1364e3fe5791375e01886b7a9"
api_secret = "NWVkZTc3ZDNkZjI2MWEyNmMxNDFkNWM1"
# 发音人（vcn）。账号里已开通的：x4_xiaoyan 讯飞小燕 / x4_yezi 讯飞小露 /
# aisjiuxu 讯飞许久 / aisjinger 讯飞小婧 / aisbabyxu 讯飞许小宝
voice = "x4_xiaoyan"
speed = 50          # 语速 0-100，50 为默认
volume = 50         # 音量 0-100
pitch = 50          # 音调 0-100
sample_rate = 16000 # raw PCM 采样率，保持 16000
timeout_secs = 15   # 单次合成整体超时

# 智能家居中枢：核心自己当 MQTT 客户端，把「设备控制」从本机扩到局域网设备。
# 走标准 MQTT 3.1.1（QoS0），zigbee2mqtt 网关开箱即用；非 Zigbee 的设备用下面
# 的 devices 表手写主题即可。下面是**默认值**，运行时可以用 QZDESK_SMARTHOME_*
# 覆盖，也可以在网页控制台「智能家居」卡片里改（改动写回 xiaozhi_config.json）：
#   QZDESK_SMARTHOME_ENABLE / _BROKER / _USER / _PASSWORD / _Z2M_TOPIC
[smarthome]
enabled = false                  # 默认关闭：没配 broker 时不必每次开机重连
broker = ""                      # 例：mqtt://192.168.1.10:1883
username = ""
password = ""
zigbee2mqtt_topic = "zigbee2mqtt" # Z2M 的 base topic；留空则不订阅 Z2M

# 天气卡片：核心直接请求 Open-Meteo（免费、无需 API Key），缓存到本地后同时
# 提供给设备首页的天气卡片和网页控制台，两边显示的是同一份数据。
#
# 下面是**默认值**，运行时可以用环境变量覆盖（换地方不必重新编译）：
#   WEATHER_LATITUDE / WEATHER_LONGITUDE / WEATHER_CITY
#   （也接受 QZDESK_WEATHER_* 前缀；WEATHER_ENABLE=0 可整体关掉）
# 不填经纬度时界面显示「未设置位置」，不填城市名时同样显示它。
[weather]
enabled = true
latitude = 31.2304              # 默认上海
longitude = 121.4737
city = "上海"
refresh_minutes = 10            # 自动刷新间隔，同时也是缓存有效期（分钟）
timeout_secs = 6                # 单次请求超时，硬上限 8 秒
proxy = ""                      # 空 = 直连（默认，最稳）。env = 沿用 http_proxy/
                                # https_proxy 环境变量；也可以直接填代理地址

# 通用设备（非 Z2M）：自己声明状态与指令主题。
# 订阅 state_topic 拿状态（payload 支持 on/off、1/0、ON/OFF 或 {"state":"ON"}），
# 向 command_topic 发指令；kind 取 switch 或 light（light 额外支持亮度）。
# [[smarthome.devices]]
# id = "desk_lamp"
# name = "书桌灯"
# kind = "light"
# state_topic = "home/desk_lamp/state"
# command_topic = "home/desk_lamp/set"
# command_on = "ON"
# command_off = "OFF"

# Hello消息参数
[hello_message]
format = "opus"
sample_rate = 24000
channels = 1
frame_duration = 20

# MCP配置
[mcp]
enabled = true

[[mcp.tools]]
name = "restart_simulator"
type = "subprocess"
description = "仅用于 QZdesk SDL 模拟器：重启模拟器的 UI 和本地核心。真实设备上不要调用。"
executable = "./restart_simulator.sh"

[[mcp.tools]]
name = "get_system_status"
description = "获取当前设备的系统状态，包括 CPU 负载、内存使用率、磁盘空间和运行时间。当用户询问系统压力、运行多久、负载情况时调用。"
type = "subprocess"
executable = "./system_status.sh"
mode = "sync"
timeout_ms = 5000
[mcp.tools.input_schema]
type = "object"
[mcp.tools.input_schema.properties]

[[mcp.tools]]
name = "robot_move"
description = "控制 QZdesk 设备运动。direction 可选 forward、backward、left、right、stop。"
type = "subprocess"
executable = "./robot_move.sh"
mode = "sync"
timeout_ms = 1000
[mcp.tools.input_schema]
type = "object"
[mcp.tools.input_schema.properties.direction]
type = "string"
description = "运动方向：forward、backward、left、right 或 stop"

# ---------------------------------------------------------------------------
# 设备自身的操作类工具（都在本机执行，不联网）
# 脚本与核心二进制放在同一个目录，所以这里用相对路径 ./xxx.sh。
# ---------------------------------------------------------------------------

[[mcp.tools]]
name = "set_brightness"
description = "调节设备屏幕亮度。用户说屏幕太亮/太暗/调暗一点/看不清时调用。"
type = "subprocess"
executable = "./set_brightness.sh"
mode = "sync"
timeout_ms = 5000
[mcp.tools.input_schema]
type = "object"
required = ["percent"]
[mcp.tools.input_schema.properties.percent]
type = "integer"
description = "目标亮度，1-100（1 最暗，100 最亮；不要传 0，那等于黑屏）"

[[mcp.tools]]
name = "set_volume"
description = "调节设备扬声器音量。用户说声音太大/太小/大点声/静音时调用。"
type = "subprocess"
executable = "./set_volume.sh"
mode = "sync"
timeout_ms = 5000
[mcp.tools.input_schema]
type = "object"
required = ["percent"]
[mcp.tools.input_schema.properties.percent]
type = "integer"
description = "目标音量，0-100"

[[mcp.tools]]
name = "speak"
description = "让设备用扬声器把一段文字念出来（本地播报，不改变对话内容）。用户说「念一下」「读出来」「播报一下」时调用。"
type = "subprocess"
executable = "./speak.sh"
mode = "sync"
timeout_ms = 30000
[mcp.tools.input_schema]
type = "object"
required = ["text"]
[mcp.tools.input_schema.properties.text]
type = "string"
description = "要念出来的文字，用中文，尽量短"

[[mcp.tools]]
name = "screenshot"
description = "给设备屏幕截图并保存成文件，返回文件路径。用户说「截个屏」「拍张屏幕」时调用。"
type = "subprocess"
executable = "./screenshot.sh"
mode = "sync"
timeout_ms = 15000
[mcp.tools.input_schema]
type = "object"
[mcp.tools.input_schema.properties.name]
type = "string"
description = "可选的文件名前缀，只支持字母数字和 . _ -"

[[mcp.tools]]
name = "power_action"
description = "重启设备、关机，或只重启界面程序。用户说「重启」「关机」「屏幕卡住了」时调用。重启或关机前一定要先跟用户确认一次，因为会中断当前对话。"
type = "subprocess"
executable = "./power_action.sh"
mode = "sync"
timeout_ms = 10000
[mcp.tools.input_schema]
type = "object"
required = ["action"]
[mcp.tools.input_schema.properties.action]
type = "string"
description = "reboot = 重启整机；poweroff = 关机；restart_gui = 只重启界面与核心（屏幕卡住、改完配置时用）"
[mcp.tools.input_schema.properties.delay]
type = "integer"
description = "多少秒后执行，默认 2，最大 30"

[[mcp.tools]]
name = "gpio_set"
description = "控制一路 GPIO 输出，用于继电器、灯、风扇这类只有开/关的外设。电机不要用这个工具，用 robot_move。"
type = "subprocess"
executable = "./gpio_set.sh"
mode = "sync"
timeout_ms = 3000
[mcp.tools.input_schema]
type = "object"
required = ["pin", "value"]
[mcp.tools.input_schema.properties.pin]
type = "integer"
description = "内核全局 GPIO 编号，例如 32 表示 GPIO1_A0"
[mcp.tools.input_schema.properties.value]
type = "integer"
description = "1 = 高电平（开），0 = 低电平（关）"

# set_timer 与 pomodoro 是核心内置工具（见 src/mcp_gateway/timer_tools.rs）：它们直接
# 读写核心里的提醒 / 番茄钟表，与设备界面、网页控制台用的是同一份数据。以前这两个工具
# 写成子进程脚本（set_timer.py / pomodoro.py），脚本只把命令写进文件等着"界面来消费"，
# 而界面从来没有读过那些文件 —— 于是语音说的"提醒我七点半喝水"在设备上什么都不会发生。
# 那两个脚本仍在仓库里（备用，且它们的默认目录已与核心对齐），但不再注册为 MCP 工具。
